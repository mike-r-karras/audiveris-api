name: Test and deploy Audiveris API

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audiveris-api-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements.txt pytest httpx pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: audiveris-api
          region: ${{ vars.GCP_REGION }}
          source: .
          flags: >-
            --allow-unauthenticated
            --cpu=2
            --memory=4Gi
            --timeout=3600
            --concurrency=4
            --min-instances=1
            --max-instances=1
            --no-cpu-throttling
          env_vars: |-
            ALLOWED_ORIGINS=https://notestream.mike-r-karras.workers.dev

      - name: Verify deployment
        run: curl --fail --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"
